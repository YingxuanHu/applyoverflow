<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ApplyOverflow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon.png" width="24" height="24" alt="" /><strong
        >ApplyOverflow</strong
      ><span>Preview</span>
    </header>
    <main>
      <p id="account" hidden></p>
      <dl class="readiness" aria-label="Autofill setup">
        <div><dt>Profile</dt><dd id="connection-state">Checking...</dd></div>
        <div><dt>Site access</dt><dd id="access-state">Checking...</dd></div>
      </dl>
      <p id="page-status" hidden></p>
      <button id="connect" type="button">Connect to ApplyOverflow</button>
      <div id="actions" hidden>
        <button id="fill" type="button">Fill contact details</button>
        <button id="resume" type="button" class="secondary">
          Choose resume
        </button>
        <button id="review" type="button" class="secondary">
          Review questions
        </button>
        <details id="more-actions">
          <summary>History &amp; tracking</summary>
          <button id="history" type="button" class="secondary">Work &amp; education</button>
          <div id="history-picker" hidden>
            <label for="history-entry">Profile entry</label>
            <select id="history-entry"></select>
            <button id="fill-history" type="button" class="secondary">Fill selected entry</button>
          </div>
          <button id="undo-history" type="button" class="secondary" hidden>Undo history fill</button>
          <button id="applied-preview" type="button" class="secondary">I applied</button>
          <form id="applied-confirmation" hidden>
            <label for="applied-company">Company</label><input id="applied-company" maxlength="200" required>
            <label for="applied-title">Job title</label><input id="applied-title" maxlength="180" required>
            <p id="applied-domain"></p>
            <label class="site-access"><input id="applied-check" type="checkbox" required>I submitted this application</label>
            <button type="submit" class="secondary">Add to applications</button>
            <button id="cancel-applied" type="button" class="secondary">Cancel</button>
          </form>
        </details>
      </div>
      <button id="undo" type="button" class="secondary" hidden>Undo contact fill</button>
      <p id="status" role="status" aria-live="polite">Checking connection...</p>
      <label class="site-access"
        ><input id="detection" type="checkbox" />Show autofill on supported
        sites</label
      >
      <p class="sites" id="access-help">Greenhouse, Lever, Ashby, Workday, iCIMS &amp; Workable. Other application sites: use the toolbar.</p>
    </main>
    <footer>
      <a id="profile" target="_blank" rel="noreferrer">Profile</a
      ><a id="settings" target="_blank" rel="noreferrer">Settings</a
      ><a id="privacy" target="_blank" rel="noreferrer">Data use</a
      ><button id="disconnect" type="button" hidden>Disconnect</button>
    </footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
