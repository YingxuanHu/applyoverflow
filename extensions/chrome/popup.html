<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ApplyOverflow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon.png" width="24" height="24" alt="" /><strong
        >ApplyOverflow</strong
      ><span>Preview</span>
    </header>
    <main>
      <p id="account" hidden></p>
      <button id="connect" type="button">Connect to ApplyOverflow</button>
      <div id="actions" hidden>
        <button id="fill" type="button">Fill contact details</button>
        <button id="resume" type="button" class="secondary">
          Choose resume
        </button>
        <button id="review" type="button" class="secondary">
          Review questions
        </button>
      </div>
      <button id="undo" type="button" class="secondary" hidden>Undo contact fill</button>
      <p id="status" role="status" aria-live="polite">Checking connection...</p>
      <label class="site-access"
        ><input id="detection" type="checkbox" />Show autofill on supported
        sites</label
      >
      <p class="sites">Greenhouse, Lever and Ashby</p>
    </main>
    <footer>
      <a id="profile" target="_blank" rel="noreferrer">Profile</a
      ><a id="settings" target="_blank" rel="noreferrer">Settings</a
      ><button id="disconnect" type="button" hidden>Disconnect</button>
    </footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
