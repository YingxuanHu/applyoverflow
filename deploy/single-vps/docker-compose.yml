x-prod-env: &prod-env
  - ${APP_ENV_FILE:-.env.production}

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  postgres:
    logging: *bounded-logging
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    env_file: *prod-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoapplication}
      POSTGRES_USER: ${POSTGRES_USER:-autoapplication}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # The tablespace policy keeps designated live indexes on the attached
      # volume while the primary cluster remains on root (the cluster is
      # larger than this volume and the volume also retains logical backups).
      - ${POSTGRES_TABLESPACE_HOST_DIR:-/mnt/HC_Volume_105915443/autoapplication/postgres-tablespace}:/var/lib/postgresql/tablespace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    env_file: *prod-env
    environment:
      NODE_ENV: production
      DATABASE_PROCESS_ROLE: web
      DISABLE_INGEST_DAEMON: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    command: ["node", "server.js"]

  worker-ingestion:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: *prod-env
    environment:
      NODE_ENV: production
      DATABASE_PROCESS_ROLE: daemon
      DISABLE_INGEST_DAEMON: "0"
      APPLYOVERFLOW_WORKER_GROUPS: ingestion
      APPLYOVERFLOW_CONTAINER_LOGS: "1"
      INGEST_OVERNIGHT_ACCELERATION: ${INGEST_OVERNIGHT_ACCELERATION:-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
    command: ["./node_modules/.bin/pm2-runtime", "ecosystem.config.cjs"]

  worker-source-workers:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: *prod-env
    environment:
      NODE_ENV: production
      DATABASE_PROCESS_ROLE: recovery_poll
      DISABLE_INGEST_DAEMON: "0"
      APPLYOVERFLOW_WORKER_GROUPS: source-workers
      APPLYOVERFLOW_CONTAINER_LOGS: "1"
      INGEST_OVERNIGHT_ACCELERATION: ${INGEST_OVERNIGHT_ACCELERATION:-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
    command: ["./node_modules/.bin/pm2-runtime", "ecosystem.config.cjs"]

  worker-maintenance:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: *prod-env
    environment:
      NODE_ENV: production
      DATABASE_PROCESS_ROLE: maintenance
      DISABLE_INGEST_DAEMON: "0"
      APPLYOVERFLOW_WORKER_GROUPS: maintenance
      APPLYOVERFLOW_CONTAINER_LOGS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
      - ../../scripts/apply-storage-lifecycle.ts:/app/scripts/apply-storage-lifecycle.ts:ro
    command: ["./node_modules/.bin/pm2-runtime", "ecosystem.config.cjs"]

  worker:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles:
      - legacy-worker
    restart: unless-stopped
    env_file: *prod-env
    environment:
      NODE_ENV: production
      DATABASE_PROCESS_ROLE: daemon
      DISABLE_INGEST_DAEMON: "0"
      APPLYOVERFLOW_WORKER_GROUPS: all
      APPLYOVERFLOW_CONTAINER_LOGS: "1"
      INGEST_OVERNIGHT_ACCELERATION: ${INGEST_OVERNIGHT_ACCELERATION:-0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../logs:/app/logs
      - ../../ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
    command: ["./node_modules/.bin/pm2-runtime", "ecosystem.config.cjs"]

  backup-runner:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles:
      - ops
    env_file: *prod-env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DB_BACKUP_HOST_DIR:-./backups}:/backups
    command: ["node", "--version"]

  caddy:
    logging: *bounded-logging
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: *prod-env
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    name: applyoverflow-edge
    external: true
