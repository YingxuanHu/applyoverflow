name: Verify
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: applyoverflow_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/applyoverflow_test
      BETTER_AUTH_SECRET: test-only-ci-secret-not-for-deployment
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://127.0.0.1:3000
      APPLICATION_EXTENSION_IDS: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,mhkkioknljkgnhgnhcamilkgbadjnmil
      TOP_PICKS_INLINE_REFRESH_KICK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Check repository hygiene
        run: node scripts/check-repository.mjs
      - run: npm ci
      - name: Audit production dependencies
        run: npm run security:audit:production
      - name: Verify release SHA gate and isolated worker runtime
        run: |
          npm run test:release-ci
          npm run test:public-health
          npm run test:worker-runtime
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:unit
      - name: Verify onboarding bridge and account isolation
        run: |
          node --test scripts/test-extension-setup-bridge.mjs
          node --test scripts/test-workspace-sender.mjs
          node --conditions=react-server --import tsx tests/integration/connected-onboarding.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run extension:test:autofill
      - run: npm run extension:test:modern
      - run: npm run extension:test:choices
      - run: npm run extension:test:submission
      - run: npm run extension:test:workspace
      - name: Verify extension connection and submission tracking
        run: node --conditions=react-server --import tsx tests/integration/application-assistant.ts
        env:
          NODE_PATH: ./node_modules/next/dist/compiled
      - name: Verify Auto Apply queue and ownership
        run: |
          node --conditions=react-server --import tsx tests/integration/auto-apply-workspace.ts
          node --conditions=react-server --import tsx tests/e2e/top-picks-mechanism.ts
        env:
          NODE_PATH: ./node_modules/next/dist/compiled
      - run: npm run extension:test:workday
      - run: npm run extension:test:reconciliation
      - run: npm run extension:test:expanded
      - run: npm run extension:test:structure
      - run: npm run extension:test:unlabelled
      - run: npm run extension:test:history-layouts
      - run: npm run extension:test:labelled-shells
      - run: npm run extension:test:upload-widgets
      - run: npm run extension:test:composite
      - run: npm run extension:test:origins
      - run: npm run extension:test:enablement
      - run: npm run extension:test:semantic
      - run: npm run extension:test:matrix
      - run: node scripts/test-application-extension-rippling.mjs
      - run: npm run extension:test:questions
      - run: npm run extension:test:progress
      - name: Verify profile-backed answer drafts
        run: node --conditions=react-server --import tsx tests/integration/extension-semantic-drafts.ts
        env:
          NODE_PATH: ./node_modules/next/dist/compiled
      - run: npm run extension:test:package
      - run: node --import tsx tests/integration/resource-budget.ts
      - run: node --import tsx tests/integration/storage-deletion.ts
      - run: node --import tsx tests/integration/ingestion-feed.ts
      - name: Verify ranked search and location contracts
        env:
          NODE_PATH: ./node_modules/next/dist/compiled
        run: |
          node --conditions=react-server --import tsx tests/e2e/search-filters.ts
          node --conditions=react-server --import tsx tests/integration/location-filters.ts
          node --conditions=react-server --import tsx tests/integration/ranked-search.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify standalone resume parser runtime
        run: node scripts/resume-parser-smoke.mjs .next/standalone
      - run: node scripts/pdf-parser-smoke.mjs .next/standalone
      - name: Verify browser workflows, search, locations and board activity
        env:
          TEST_APP_URL: http://127.0.0.1:3000
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/workspace-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null || { cat /tmp/workspace-server.log; exit 1; }
          npm run test:auto-apply:ui
          npm run test:auto-apply:connected
          node --import tsx tests/e2e/profile-onboarding.ts
          node --import tsx tests/e2e/connected-onboarding-recovery.ts
          node --import tsx tests/e2e/announcements.ts
          node --import tsx tests/e2e/getting-started.ts
          node --import tsx tests/e2e/location-filters.mjs
          node --import tsx tests/e2e/deferred-search-count.ts
          npm run test:jobs:activity
      - name: Keep workflow screenshots, traces and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-workflow-benchmark
          path: |
            output/playwright/auto-apply/
            output/playwright/auto-apply-connected/
            output/playwright/extension-setup-*.png
            output/playwright/onboarding-*.png
            output/playwright/profile-history-*.png
            output/playwright/location-*.png
            output/playwright/search-count-*.png
            output/playwright/jobs-activity-*.png
            output/playwright/autofill-guide-*.png
            output/playwright/autofill-email-*.png
            output/playwright/getting-started-*.png
            /tmp/workspace-server.log
          retention-days: 14
          if-no-files-found: ignore
