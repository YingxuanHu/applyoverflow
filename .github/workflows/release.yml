name: Release production
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
# Never interrupt a running deploy or rollback.
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_PRODUCTION == 'true')
    uses: ./.github/workflows/verify.yml

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      web: ${{ steps.names.outputs.web }}@${{ steps.web.outputs.digest }}
      migrations: ${{ steps.names.outputs.migrations }}@${{ steps.migrations.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve registry names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "web=ghcr.io/${REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
          echo "migrations=ghcr.io/${REPOSITORY,,}-migrations" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: web
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,scope=production-web,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: migrations
        with:
          context: .
          target: migration-check
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.migrations }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=production-migrations
          cache-to: type=gha,scope=production-migrations,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://applyoverflow.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a superseded main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Deploy verified images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          WEB_IMAGE: ${{ needs.images.outputs.web }}
          MIGRATION_IMAGE: ${{ needs.images.outputs.migrations }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/ci/dispatch.sh deploy
      - name: Release summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ job.status }}
          WEB_IMAGE: ${{ needs.images.outputs.web }}
        run: |
          printf '## Production web release\n\nRevision: %s\n\nImage: %s\n\nResult: %s\n\nWorkers were not restarted.\n' "$GITHUB_SHA" "$WEB_IMAGE" "$DEPLOY_RESULT" >> "$GITHUB_STEP_SUMMARY"
